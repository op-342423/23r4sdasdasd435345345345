<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THORN — sign up</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="nav">
    <a href="index.html" class="nav__mark chrome-text" style="text-decoration:none;">THORN</a>
    <nav class="nav__links">
      <a href="index.html">Back to shop</a>
    </nav>
  </header>

  <div class="panel" style="max-width:420px;margin:2rem auto;">
    <h1>Create an account</h1>
    <p style="color:var(--muted);font-size:0.85rem;margin-bottom:1.5rem;">
      Takes a few seconds — lets you track orders and save a wishlist.
    </p>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 6 characters">
    </div>

    <button class="btn" id="registerBtn">Create account</button>
    <p style="margin-top:1rem;color:var(--muted);font-size:0.85rem;">
      Already have an account? <a href="login.html">Log in</a>
    </p>
  </div>

  <script src="api.js"></script>
  <script src="ui.js"></script>
  <script src="register.js"></script>
</body>
</html>
