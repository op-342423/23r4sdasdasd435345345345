<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THORN — checkout</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Complete your THORN order — cash on delivery, Vodafone Cash, or InstaPay. Pin your exact delivery location with GPS.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Open Graph / social share preview -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="THORN">
  <meta property="og:title" content="THORN — Checkout">
  <meta property="og:description" content="Complete your THORN order — cash on delivery, Vodafone Cash, or InstaPay. Pin your exact delivery location with GPS.">
  <meta property="og:image" content="https://thorn-store.example.com/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://thorn-store.example.com/checkout.html">

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="THORN — Checkout">
  <meta name="twitter:description" content="Complete your THORN order — cash on delivery, Vodafone Cash, or InstaPay. Pin your exact delivery location with GPS.">
  <meta name="twitter:image" content="https://thorn-store.example.com/assets/og-image.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="nav">
    <a href="index.html" class="nav__mark chrome-text" data-brand style="text-decoration:none;">THORN</a>
    <nav class="nav__links">
      <a href="index.html">Back to shop</a>
      <span class="account-bar" id="accountBar"></span>
    </nav>
  </header>

  <div class="panel">
    <h1>Your order</h1>

    <div id="cartLines"></div>

    <div class="field coupon-row">
      <input type="text" id="couponInput" placeholder="Coupon code">
      <button type="button" class="btn btn--ghost" id="applyCouponBtn" style="width:auto;">Apply</button>
    </div>
    <p class="coupon-status" id="couponStatus"></p>

    <div class="order-summary">
      <div class="order-summary__row"><span>Subtotal</span><span id="cartSubtotal">$0</span></div>
      <div class="order-summary__row" id="discountRow" style="display:none;"><span>Discount</span><span id="cartDiscount">$0</span></div>
      <div class="order-summary__row"><span>Delivery</span><span id="cartDelivery">$0</span></div>
      <div class="cart-total"><span>Total</span><span id="cartTotal">$0</span></div>
    </div>
    <p class="delivery-estimate" id="deliveryEstimate"></p>

    <div style="margin-top:2rem;">
      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" placeholder="e.g. 010 1234 5678">
      </div>
      <div class="field">
        <label for="address">Address / area</label>
        <textarea id="address" rows="2" placeholder="Building, street, city"></textarea>
      </div>
      <div class="field">
        <label for="notes">Order notes (optional)</label>
        <textarea id="notes" rows="2" placeholder="e.g. Leave at the gate, call before arriving"></textarea>
      </div>

      <div class="field">
        <label>Exact location</label>
        <button type="button" class="btn btn--ghost" id="gpsBtn" style="width:auto;">Pin my exact location</button>
        <p class="gps-status" id="gpsStatus">No location shared yet.</p>
      </div>

      <div class="field" id="paymentMethodsSection" style="background:var(--surface);border:1px solid #2a2a2a;border-radius:6px;padding:0.9rem;">
        <strong style="font-size:0.9rem;">Payment method</strong>
        <div id="paymentMethodsList" style="margin-top:0.6rem;">
          <p style="color:var(--muted);font-size:0.85rem;">Loading payment methods…</p>
        </div>
      </div>

      <button class="btn" id="placeOrderBtn" style="margin-top:0.5rem;">Place order</button>
    </div>

    <div class="confirm-box" id="confirmBox" style="display:none;"></div>
  </div>

  <!-- Location picker: a real draggable-pin map, not a silent one-shot
       geolocation read. Device GPS/IP location is only used to choose
       a starting point — the shopper always drags the pin to correct
       it before confirming, so the address that reaches the order is
       whatever they actually placed the pin on. -->
  <div class="modal-overlay" id="locationModal">
    <div class="location-modal-box">
      <button class="modal-close" id="locationModalClose" aria-label="Close">&times;</button>
      <div class="location-modal__header">
        <h3>Drop a pin on your delivery location</h3>
        <p>Drag the pin or tap anywhere on the map to place it exactly where we should deliver.</p>
      </div>
      <div class="location-modal__map" id="locationMap"></div>
      <p class="location-modal__pin-note" id="locationPinAddress"></p>
      <div class="location-modal__actions">
        <button type="button" class="location-modal__recenter" id="locationUseGpsBtn">&#128205; Use my current GPS</button>
        <div class="location-modal__confirm-group">
          <button type="button" class="btn btn--ghost" id="locationCancelBtn" style="width:auto;">Cancel</button>
          <button type="button" class="btn" id="locationConfirmBtn" style="width:auto;">Confirm this pin</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <script src="api.js" defer></script>
  <script src="brand.js" defer></script>
  <script src="ui.js" defer></script>
  <script src="announcement.js" defer></script>
  <script src="coupon-banner.js" defer></script>
  <script src="footer.js" defer></script>
  <script src="checkout.js" defer></script>
</body>
</html>
