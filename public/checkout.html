<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THORN — checkout</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <meta name="description" content="Complete your THORN order — cash on delivery, Vodafone Cash, or InstaPay.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://YOUR-DOMAIN-HERE.com/checkout.html">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="THORN">
  <meta property="og:title" content="THORN — checkout">
  <meta property="og:description" content="Complete your THORN order — cash on delivery, Vodafone Cash, or InstaPay.">
  <meta property="og:url" content="https://YOUR-DOMAIN-HERE.com/checkout.html">
  <meta property="og:image" content="https://YOUR-DOMAIN-HERE.com/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="THORN — checkout">
  <meta name="twitter:description" content="Complete your THORN order — cash on delivery, Vodafone Cash, or InstaPay.">
  <meta name="twitter:image" content="https://YOUR-DOMAIN-HERE.com/assets/og-image.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="nav">
    <a href="index.html" class="nav__mark chrome-text" data-brand style="text-decoration:none;">THORN</a>
    <nav class="nav__links">
      <a href="index.html">Back to shop</a>
      <span class="account-bar" id="accountBar"></span>
    </nav>
  </header>

  <div class="panel">
    <h1>Your order</h1>

    <div id="cartLines"></div>

    <div class="field coupon-row">
      <input type="text" id="couponInput" placeholder="Coupon code">
      <button type="button" class="btn btn--ghost" id="applyCouponBtn" style="width:auto;">Apply</button>
    </div>
    <p class="coupon-status" id="couponStatus"></p>

    <div class="order-summary">
      <div class="order-summary__row"><span>Subtotal</span><span id="cartSubtotal">$0</span></div>
      <div class="order-summary__row" id="discountRow" style="display:none;"><span>Discount</span><span id="cartDiscount">$0</span></div>
      <div class="order-summary__row"><span>Delivery</span><span id="cartDelivery">$0</span></div>
      <div class="cart-total"><span>Total</span><span id="cartTotal">$0</span></div>
    </div>
    <p class="delivery-estimate" id="deliveryEstimate"></p>

    <div style="margin-top:2rem;">
      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" placeholder="e.g. 010 1234 5678">
      </div>
      <div class="field">
        <label for="address">Address / area</label>
        <textarea id="address" rows="2" placeholder="Building, street, city"></textarea>
      </div>
      <div class="field">
        <label for="notes">Order notes (optional)</label>
        <textarea id="notes" rows="2" placeholder="e.g. Leave at the gate, call before arriving"></textarea>
      </div>

      <div class="field">
        <label>Exact location</label>
        <button type="button" class="btn btn--ghost" id="gpsBtn" style="width:auto;">Share my location</button>
        <p class="gps-status" id="gpsStatus">No location shared yet.</p>
      </div>

      <div class="field" id="paymentMethodsSection" style="background:var(--surface);border:1px solid #2a2a2a;border-radius:6px;padding:0.9rem;">
        <strong style="font-size:0.9rem;">Payment method</strong>
        <div id="paymentMethodsList" style="margin-top:0.6rem;">
          <p style="color:var(--muted);font-size:0.85rem;">Loading payment methods…</p>
        </div>
      </div>

      <button class="btn" id="placeOrderBtn" style="margin-top:0.5rem;">Place order</button>
    </div>

    <div class="confirm-box" id="confirmBox" style="display:none;"></div>
  </div>

  <script src="api.js"></script>
  <script src="brand.js"></script>
  <script src="ui.js"></script>
  <script src="announcement.js"></script>
  <script src="footer.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
