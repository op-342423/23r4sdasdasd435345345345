<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THORN — rings, clothing, chains</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="nav">
    <span class="nav__mark chrome-text" data-brand>THORN</span>
    <nav class="nav__links">
      <a href="#products">Shop</a>
      <a href="#" id="cartOpenBtn">Cart <span class="cart-count" id="cartCount">0</span></a>
      <div class="nav__social" id="navSocial" aria-label="Social links">
        <button type="button" class="social-icon" id="socialFacebook" data-tip="Facebook" aria-label="Facebook page">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15 3H9a6 6 0 0 0-6 6v6a6 6 0 0 0 6 6h3v-7.2H9.9v-2.8H12V8.8c0-2.1 1.3-3.3 3.2-3.3.9 0 1.9.16 1.9.16v2.1h-1.07c-1.05 0-1.38.66-1.38 1.33v1.7h2.35l-.38 2.8H14.65V21H15a6 6 0 0 0 6-6V9a6 6 0 0 0-6-6z"/></svg>
        </button>
        <button type="button" class="social-icon" id="socialInstagram" data-tip="Instagram" aria-label="Instagram page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
        </button>
        <button type="button" class="social-icon" id="socialPhone" data-tip="Call / copy number" aria-label="Phone number">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8c1.3 2.6 3.5 4.7 6 6l2-2c.3-.3.8-.4 1.2-.3 1.2.4 2.6.6 4 .6.6 0 1 .5 1 1V20c0 .6-.4 1-1 1C10.5 21 3 13.5 3 4c0-.6.4-1 1-1h3.9c.6 0 1 .4 1 1 0 1.4.2 2.8.6 4 .1.4 0 .9-.3 1.2l-2.6 1.6z"/></svg>
        </button>
      </div>
      <span class="account-bar" id="accountBar"></span>
    </nav>
  </header>

  <div class="cart-drawer__overlay" id="cartDrawerOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer" role="dialog" aria-label="Your cart" aria-hidden="true">
    <div class="cart-drawer__header">
      <h2>Your cart</h2>
      <button class="cart-drawer__close" id="cartDrawerClose" aria-label="Close cart">&times;</button>
    </div>
    <div class="cart-drawer__items" id="cartDrawerItems"></div>
    <div class="cart-drawer__actions" id="cartDrawerActions" style="display:none;">
      <button type="button" class="cart-drawer__link" id="cartDrawerContinueBtn">Continue shopping</button>
      <button type="button" class="cart-drawer__link cart-drawer__link--danger" id="cartDrawerClearBtn">Remove all</button>
    </div>
    <div class="cart-drawer__footer">
      <div class="cart-drawer__total">
        <span>Total</span>
        <span id="cartDrawerTotal">$0</span>
      </div>
      <a class="btn" href="checkout.html" id="cartDrawerCheckoutBtn" style="text-decoration:none;text-align:center;">Go to checkout</a>
    </div>
  </aside>

  <section class="hero">
    <video class="hero__video" id="heroVideo" autoplay muted loop playsinline>
      <source src="assets/hero.mp4" type="video/mp4">
    </video>
    <!-- Reveal veil: pure black, sits over the video and fades away as
         THORN finishes forming, so the video emerges from darkness
         instead of cutting in. Driven by luxury.js. -->
    <div class="hero__veil" id="heroVeil"></div>

    <!-- ==========================================================
         THE ORB REVEAL — brief Part 9. Replaces the old letter-by-
         letter "THORN" formation entirely. A single point of light
         rotates, morphs into a ring, then blooms — after which the
         brand wordmark (any length, from section 8) fades in as one
         whole block. Built as SVG + gradients, animated by GSAP in
         luxury.js; no WebGL, no per-letter logic, no dependency on
         the brand name's character count. Purely decorative, so it
         is aria-hidden and sits above the veil but below the text. -->
    <div class="intro-orb" id="introOrb" aria-hidden="true">
      <svg viewBox="0 0 200 200" width="200" height="200">
        <defs>
          <radialGradient id="orbBodyGrad" cx="38%" cy="32%" r="70%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="40%" stop-color="#c9c9c9"/>
            <stop offset="100%" stop-color="#050505"/>
          </radialGradient>
          <linearGradient id="orbSheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="orbBloomGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
            <stop offset="55%" stop-color="#ffffff" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <!-- Beat 4: the ring the orb morphs into (starts invisible). -->
        <circle id="orbRing" cx="100" cy="100" r="46" fill="none" stroke="url(#orbBodyGrad)" stroke-width="0" opacity="0"/>
        <!-- Beat 2-3: the dense point of light that rotates and grows. -->
        <circle id="orbDisk" cx="100" cy="100" r="0" fill="url(#orbBodyGrad)"/>
        <!-- The rotating specular highlight sweeping across the surface. -->
        <g id="orbSheenGroup" style="transform-origin: 100px 100px;">
          <ellipse id="orbSheen" cx="100" cy="66" rx="5" ry="24" fill="url(#orbSheenGrad)" opacity="0"/>
        </g>
        <!-- Beat 5: the bloom — a fast-expanding glow, the moment of release. -->
        <circle id="orbBloom" cx="100" cy="100" r="0" fill="url(#orbBloomGrad)" opacity="0"/>
      </svg>
    </div>

    <div class="hero__vignette"></div>
    <div class="hero__grain"></div>
    <div class="hero__content">
      <h1 class="hero__title chrome-text" id="heroTitle" data-brand aria-label="THORN">THORN</h1>
      <p class="hero__sub" data-hero-tagline>NOT MADE FOR EVERYONE.</p>
      <div class="hero__cta">
        <button type="button" class="hero__cta-btn" id="learnMoreBtn">Learn more</button>
        <a href="#products" class="hero__cta-btn" id="viewCollectionBtn">View collection</a>
      </div>
    </div>
    <button type="button" class="hero__skip-intro" id="skipIntroBtn" aria-label="Skip intro animation">Skip intro</button>
    <button type="button" class="hero__scroll-indicator" id="scrollIndicator" aria-label="Scroll down">
      <span class="hero__scroll-indicator-label">Scroll</span>
      <span class="hero__scroll-indicator-arrow">&darr;</span>
    </button>
  </section>

  <!-- ==========================================================
       LEARN MORE — dynamic, fully admin-driven. Hidden by default;
       learn-more.js fetches the owner's content and only reveals
       the section if it's enabled and has a title set. Nothing here
       is hardcoded — every string and the background come from the
       admin dashboard's "Learn More" panel.
       ========================================================== -->
  <section class="learn-more" id="learnMore" aria-labelledby="lmTitle" hidden>
    <div class="learn-more__bg" id="lmBg">
      <div class="learn-more__bg-image" id="lmBgImage"></div>
      <video class="learn-more__bg-video" id="lmBgVideo" autoplay muted loop playsinline></video>
      <div class="learn-more__overlay"></div>
      <div class="learn-more__vignette"></div>
      <div class="learn-more__grain"></div>
    </div>
    <div class="learn-more__content" id="lmContent">
      <p class="learn-more__subtitle" id="lmSubtitle"></p>
      <h2 class="learn-more__title" id="lmTitle"></h2>
      <p class="learn-more__description" id="lmDescription"></p>
      <blockquote class="learn-more__quote" id="lmQuote"></blockquote>
      <a class="learn-more__btn" id="lmButton" href="#products">
        <span class="learn-more__btn-label" id="lmButtonLabel">Discover</span>
      </a>
    </div>
  </section>

  <div class="holo-bar"></div>

  <!-- ==========================================================
       COLLECTION STORIES — brief Part 9. Each collection gets a
       title, story, mood and hero media instead of just showing
       up as a filter chip. Fully admin-driven, multi-row; hidden
       until at least one enabled row exists. Populated by
       collections.js. ========================================================== -->
  <section class="collection-stories" id="collectionStories" hidden>
    <h2 class="collection-stories__heading">Collections</h2>
    <div class="collection-stories__list" id="collectionStoriesList"></div>
  </section>

  <div class="marquee">
    <div class="marquee__track" id="marqueeTrack">DROP 003 OUT NOW &nbsp;&#8226;&nbsp; PAY AT THE DOOR &nbsp;&#8226;&nbsp; DROP 003 OUT NOW &nbsp;&#8226;&nbsp; PAY AT THE DOOR &nbsp;&#8226;&nbsp;</div>
  </div>

  <section class="products" id="products">
    <h2>The collection</h2>

    <div class="shop-controls">
      <div class="shop-search">
        <input type="text" id="searchInput" placeholder="Search rings, chains, hoodies…" aria-label="Search products">
      </div>
      <div class="shop-filters" id="categoryFilters" role="group" aria-label="Filter by category">
        <button type="button" class="filter-chip is-active" data-category="All">All</button>
        <button type="button" class="filter-chip" data-category="Rings">Rings</button>
        <button type="button" class="filter-chip" data-category="Clothing">Clothing</button>
        <button type="button" class="filter-chip" data-category="Accessories">Accessories</button>
      </div>
      <select class="shop-sort" id="sortSelect" aria-label="Sort products">
        <option value="newest">Newest</option>
        <option value="price-asc">Price: Low → High</option>
        <option value="price-desc">Price: High → Low</option>
      </select>
    </div>

    <p class="shop-empty" id="shopEmpty" style="display:none;">No items match your search.</p>
    <div class="product-grid" id="productGrid"></div>
  </section>

  <!-- ==========================================================
       EDITORIAL — brief Part 10. Pure storytelling: campaign
       photography, runway/BTS stills or clips, and quotes.
       Never shows a price. Fully admin-driven, multi-row; hidden
       until at least one enabled row exists. Populated by
       editorial.js. ========================================================== -->
  <section class="editorial" id="editorial" hidden>
    <h2 class="editorial__heading">Editorial</h2>
    <div class="editorial__grid" id="editorialGrid"></div>
  </section>

  <div class="modal-overlay" id="productModal">
    <div class="modal-box">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <div class="modal-gallery">
        <button class="modal-arrow modal-arrow--prev" id="modalPrev" aria-label="Previous photo">&#8249;</button>
        <img class="modal-image" id="modalImage" src="" alt="">
        <button class="modal-arrow modal-arrow--next" id="modalNext" aria-label="Next photo">&#8250;</button>
      </div>
      <div class="modal-dots" id="modalDots"></div>
      <div class="modal-info">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:0.5rem;">
          <p class="category" id="modalCategory"></p>
          <button type="button" class="wishlist-btn" id="modalWishlistBtn" aria-label="Save to wishlist" aria-pressed="false">&#9825;</button>
        </div>
        <h2 id="modalName"></h2>
        <p class="price" id="modalPrice"></p>
        <p class="stock-note" id="modalStock"></p>
        <p class="modal-desc" id="modalDesc"></p>
        <div class="qty-selector" id="modalQtyWrap">
          <button type="button" class="qty-btn" id="modalQtyMinus" aria-label="Decrease quantity">&minus;</button>
          <span class="qty-value" id="modalQtyValue">1</span>
          <button type="button" class="qty-btn" id="modalQtyPlus" aria-label="Increase quantity">+</button>
        </div>
        <button class="btn" id="modalAddBtn">Add to cart</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="aboutModal">
    <div class="modal-box modal-box--about">
      <button class="modal-close" id="aboutModalClose" aria-label="Close">&times;</button>
      <div class="about-modal__content">
        <span class="about-modal__mark chrome-text" data-brand>THORN</span>
        <p class="about-modal__text" id="aboutModalText">Loading…</p>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lenis/1.1.13/lenis.min.js"></script>
  <script src="api.js"></script>
  <script src="brand.js"></script>
  <script src="ui.js"></script>
  <script src="luxury.js"></script>
  <script src="script.js"></script>
  <script src="learn-more.js"></script>
  <script src="collections.js"></script>
  <script src="editorial.js"></script>
  <script src="cursor.js?v=2"></script>
</body>
</html>
