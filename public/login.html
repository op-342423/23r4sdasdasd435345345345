<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THORN — log in</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="nav">
    <a href="index.html" class="nav__mark chrome-text" data-brand style="text-decoration:none;">THORN</a>
    <nav class="nav__links">
      <a href="index.html">Back to shop</a>
    </nav>
  </header>

  <div class="panel" style="max-width:420px;margin:2rem auto;">
    <h1>Log in</h1>
    <p style="color:var(--muted);font-size:0.85rem;margin-bottom:1.5rem;">
      Log in to check out, track your orders, and save items to your wishlist.
    </p>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Your password">
    </div>

    <button class="btn" id="loginBtn">Log in</button>
    <p style="margin-top:1rem;color:var(--muted);font-size:0.85rem;">
      No account yet? <a href="register.html">Sign up</a>
    </p>
  </div>

  <script src="api.js"></script>
  <script src="brand.js"></script>
  <script src="ui.js"></script>
  <script src="announcement.js"></script>
  <script src="footer.js"></script>
  <script src="login.js"></script>
</body>
</html>
