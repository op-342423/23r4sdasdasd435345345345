<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THORN — log in</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="nav">
    <a href="index.html" class="nav__mark chrome-text" data-brand style="text-decoration:none;">THORN</a>
    <nav class="nav__links">
      <a href="index.html">Back to shop</a>
    </nav>
  </header>

  <div class="auth-wrap">
    <div class="auth-card" id="authCard">
      <span class="auth-card__mark chrome-text" data-brand>THORN</span>
      <div class="auth-card__divider"></div>
      <h1>Log in</h1>
      <p class="auth-card__sub">
        Log in to check out, track your orders, and save items to your wishlist.
      </p>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
      </div>

      <button class="btn" id="loginBtn">Log in</button>
      <p class="auth-card__foot">
        No account yet? <a href="register.html">Sign up</a>
      </p>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="brand.js"></script>
  <script src="ui.js"></script>
  <script src="announcement.js"></script>
  <script src="footer.js"></script>
  <script src="login.js"></script>
</body>
</html>
